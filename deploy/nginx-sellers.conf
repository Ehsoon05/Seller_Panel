limit_req_zone $binary_remote_addr zone=seller_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name sellers.phantomhubs.shop;

    # Do not let SPA fallback turn common secret-file probes into HTTP 200s.
    location ~* ^/(?:\.|etc/|storage/|config/|wp-admin/|actuator/|backup|database|dump|secrets|server\.key|docker-compose) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/(auth/login|services)$ {
        limit_req zone=seller_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
